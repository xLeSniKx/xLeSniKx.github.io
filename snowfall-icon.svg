<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a92dd"/>
      <stop offset="1" stop-color="#2a63ac"/>
    </linearGradient>
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-170"/>
      <line x1="0" y1="-90" x2="-34" y2="-124"/>
      <line x1="0" y1="-90" x2="34" y2="-124"/>
      <line x1="0" y1="-140" x2="-22" y2="-162"/>
      <line x1="0" y1="-140" x2="22" y2="-162"/>
    </g>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>

  <g transform="translate(256 256)" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>

  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
</svg>